# Each entry is one project. `id` must be unique across the bank — it's
# the key used in the generated resume data and in verification violation
# messages.
#
# tags: the allowed-vocabulary whitelist. Used both by select_projects
# (to match against the JD) and by verify (a rewritten bullet can't
# introduce a tag/number that isn't in the original bullets or here).
#
# date: rendered right-aligned in the entry heading.
# subtitle: optional one-liner rendered under the title (e.g. "Academic
# Major Project: Python, PyTorch"); falls back to `company`, then tags.
#
# bullets.full: the complete, ground-truth bullet points for this entry.
# bullets.short: optional condensed variants for space-constrained
# resumes — not yet wired into resume_agent.py, reserved for later.

- id: swaraaha
  title: "Swaraaha — Speech Dysfluency Detection"
  date: "2026"
  tags: [ml, speech-processing, deep-learning, pytorch, desktop-app, web-development, react, fastapi]
  bullets:
    full:
      - "Classifies speech dysfluencies — prolongation, block, sound repetition, word repetition, and interjection — with five Wav2Vec 2.0 binary classifiers combined by a hybrid MLP"
      - "Localizes where dysfluencies occur using a CNN over spectrogram images"
      - "Ships as both a React + FastAPI web app and a PySide6 desktop app sharing a common model directory"
      - "Built the ML pipelines with PyTorch and Hugging Face Transformers"
    short:
      - "Built a speech dysfluency detection system with Wav2Vec 2.0 classification and spectrogram-CNN localization"

- id: notesleclerc
  title: "NotesLeclerc — Lecture Notes Summarizer"
  date: "2026"
  tags: [nlp, llm, python, streamlit, web-development]
  bullets:
    full:
      - "Built a lecture notes summarizer that converts PDFs, text transcripts, and audio recordings into structured bullet-point summaries"
      - "Transcribes audio locally with OpenAI Whisper and extracts PDF text with pypdf"
      - "Orchestrates a Python LangGraph pipeline that calls Azure OpenAI (GPT-4o) for LLM summarization"
      - "Offers Topic-Grouped, Sequential, and Structured summary formats with Markdown and plain-text export from a Streamlit UI"
    short:
      - "Built a Streamlit lecture notes summarizer using LangGraph, Azure OpenAI (GPT-4o), and local Whisper transcription"

- id: resurrect
  title: "Resurrect — Resume Tailoring CLI"
  date: "2026"
  tags: [llm, python, cli, prompt-engineering]
  bullets:
    full:
      - "Built a CLI that tailors a Typst resume to each job description through a LangGraph pipeline"
      - "LLM selects the best-matching projects, rewrites bullets to mirror the JD's phrasing, and deterministically verifies no new facts are invented"
      - "Backend-agnostic: runs on Ollama, Anthropic, or Azure OpenAI models"
      - "Compiles a standalone .typ file and PDF per application with typst"
    short:
      - "Built a LangGraph CLI that tailors a Typst resume to each job description"
